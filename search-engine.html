<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Search Page</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">

        <!-- Погода -->
        <div class="weather">
            <div class="temperature">36°</div>
            <div class="city">Ahmedabad</div>
        </div>

        <!-- Центральная часть -->
        <div class="content">

            <h1 class="clock">09:11:01</h1>

            <div class="greeting">
                Good Morning, Saad.
            </div>

            <!-- Поиск -->
            <div class="search">
                <span class="search-icon">⌕</span>
                <span class="search-text">Search</span>
            </div>

            <!-- Иконки -->
            <div class="links">

                <div class="link">
                    <img src="img/youtube.png" alt="YouTube">
                </div>

                <div class="link">
                    <img src="img/chatgpt.png" alt="ChatGPT">
                </div>

                <div class="link">
                    <img src="img/docker.png" alt="Docker">
                </div>

                <div class="link">
                    <img src="img/Deepseek.png" alt="DeepSeek">
                </div>

                <div class="link">
                    <img src="img/git.png" alt="GitHub">
                </div>

                <div class="link">
                    <img src="img/in.png" alt="LinkedIn">
                </div>

                <div class="link">
                    <img src="img/plus.png" alt="Add">
                </div>

            </div>

        </div>

    </div>

</body>
</html>
