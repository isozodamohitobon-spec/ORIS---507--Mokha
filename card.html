<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Search Page</title>

    <!-- Font Awesome для значков -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

     <link rel="stylesheet" href="style.css"> 
</head>

<body>

    <!-- Весь экран -->
    <div class="page">

        <!-- Погода в правом верхнем углу -->
        <div class="weather">
            <div class="temperature">36°</div>
            <div class="city">Ahmedabad</div>
        </div>

        <!-- Центральный блок -->
        <div class="content">

            <!-- Время -->
            <h1 class="clock">09:11:01</h1>

            <!-- Приветствие -->
            <div class="greeting">
                Good Morning, Saad.
            </div>


            <!-- Поле поиска -->
            <div class="search">

                <i class="fa-solid fa-magnifying-glass"></i>

                <span>Search</span>

            </div>


            <!-- Кнопки с сайтами -->
            <div class="links">

                <!-- YouTube -->
                <div class="link">
                    <i class="fa-brands fa-youtube youtube"></i>
                </div>


                <!-- ChatGPT -->
                <div class="link">
                    <img src="img/chatgpt.png" alt="ChatGPT"
                    class="openai">
                </div>

                <!-- DN -->
                <div class="link">
                    <img src="img/docker.png" alt="Docker"
                    class="docker">
                </div>

                 <!--DeepSeek-->
                <div class="link">
                    <img src="img/Deepseek.png" alt="DeepSeek"
                    class="deepseek">
                </div>

                <!-- GitHub -->
                <div class="link">
                    <img src="img/git.png" alt="GitHub"
                    class="github">
                </div>


                <!-- LinkedIn -->
                <div class="link">
                    <img src="img/in.png" alt="LinkedIn"
                    class="LinkedIn">
                </div>


                <!-- Плюс -->
                <div class="link add">
                    <img src="img/plus.png" alt="Add"
                    class="add">
                </div>

            </div>

        </div>

    </div>

</body>
</html>
